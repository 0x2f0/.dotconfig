# volume controls (alsamixer)
## mute audio
bind=, F1, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
## Increase volume
bind = , F3, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
## Decrease volume
bind = , F2, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%-

# binde=,,exec,ddcutil setvcp 10 + 5
# binde=,,exec,ddcutil setvcp 10 - 5
$brightness_script=$HOME/.config/.dotconfig/hypr/scripts/brightness.sh

bindel=,XF86MonBrightnessUp,exec,$brightness_script true
bindel=,XF86MonBrightnessDown,exec,$brightness_script
bindel=,F6,exec,$brightness_script true
bindel=,F5,exec,$brightness_script
